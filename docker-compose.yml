#version: "3.8"

#Code Reference: Technology:
#🚀 How It Works
#Prometheus scrapes metrics from your Spring Boot app (/actuator/prometheus).
#
#Loki ingests logs (via Alloy or Promtail).
#
#Tempo ingests traces (via Alloy or OpenTelemetry SDK).
#
#Grafana connects to all three and provides dashboards.
#
#Alloy acts as the unified agent to collect and forward telemetry.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_tracefile
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml #When Grafana starts: Datasources → Prometheus, Loki, Tempo auto‑connected. | Dashboards → “Unified Observability” auto‑loaded.
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_tracefile
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:latest
    container_name: loki_tracefile
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./src/main/resources/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:latest
    container_name: tempo_tracefile
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./src/main/resources/tempo.yaml:/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  alloy:
    image: grafana/alloy:latest
    container_name: alloy_tracefile
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./alloy.river:/etc/alloy/config.alloy
      - ./logs:/var/log/trace-file
    ports:
      - "12345:12345" # example port for metrics/logs/traces pipeline
    depends_on:
      - prometheus
      - loki
      - tempo
